image: conan-cpp:latest

# We need to get the full history so we can automatically generate a version:
variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

stages:
  - build_and_upload
  - deploy_tst

build_and_upload:
  stage: build_and_upload
  script:
    - git tag
    - ./build-image.sh
  only:
    - main

deploy_tst:
  stage: deploy_tst
  environment: tst
  image: ansible:latest
  script:
    - ./deploy-to.sh tst
  only:
    - main
