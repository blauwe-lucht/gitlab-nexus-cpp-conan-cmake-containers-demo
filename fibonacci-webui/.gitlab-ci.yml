image: conan-cpp:latest

# We need to get the full history so we can automatically generate a version:
variables:
  GIT_DEPTH: "0"

stages:
  - build_and_upload
  - deploy_tst

build_and_upload:
  stage: build_and_upload
  script:
    - git show-ref --tags
    - git describe --tags --abbrev=0 --match 'webui-*'
    - git log -1 --oneline
    - git tag --merged HEAD
    - git log --oneline --decorate --graph --all --simplify-by-decoration
    - ./build-image.sh
  only:
    - main

deploy_tst:
  stage: deploy_tst
  environment: tst
  image: ansible:latest
  script:
    - ./deploy-to.sh tst
  only:
    - main
